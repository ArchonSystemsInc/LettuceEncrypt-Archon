name: CI

on:
  push:
    branches-ignore:
      # `*` stops at `/`, and dependabot branches are several segments deep
      # (e.g. dependabot/nuget/src/some-group-abc123), so `**` is required to
      # suppress the push run that duplicates the pull_request run.
      - dependabot/**
  pull_request:
  workflow_dispatch:
    inputs:
      is_stable_build:
        description: Use a version number indicating this is a stable release
        required: true
        default: "false"
      release:
        description: Create a release
        required: true
        default: "false"

env:
  IS_STABLE_BUILD: ${{ github.event.inputs.is_stable_build }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    outputs:
      package_version: ${{ steps.build_script.outputs.package_version }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Run build script
        id: build_script
        run: ./build.ps1 -ci
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
#      - uses: codecov/codecov-action@v7
#        with:
#          name: unittests-${{ matrix.os }}
#          fail_ci_if_error: true
#          token: ${{ secrets.CODECOV_TOKEN }}
  release:
    if: ${{ github.event.inputs.release == 'true' }}
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write # required for NuGet.org trusted publishing (OIDC)
      contents: write # required to create the GitHub release
      packages: write # required to push to the GitHub package registry
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
    steps:
      - run: echo "Releasing ${{ env.PACKAGE_VERSION }}"
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: Configure GitHub NuGet registry
        run: nuget sources add -name github -source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json -username ${{ github.repository_owner }} -password ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GitHub package registry
        run: nuget push packages\*.nupkg -ApiKey ${{ secrets.GITHUB_TOKEN }} -Source github -SkipDuplicate
      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet.org API key. The key expires after 1 hour, so log in immediately
      # before pushing. Policy is configured at nuget.org under the
      # ArchonSystemsInc account and is scoped to this repo + ci.yml.
      - name: NuGet.org login (OIDC)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ArchonSystemsInc
      - name: Push to NuGet.org
        run: nuget push packages\*.nupkg -ApiKey ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json -SkipDuplicate
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.PACKAGE_VERSION }}
          tag_name: v${{ env.PACKAGE_VERSION }}
          generate_release_notes: true
          append_body: true
          body: |
            ### How to get this update

            Packages have been posted to these feeds:

            #### NuGet.org
            https://nuget.org/packages/LettuceEncrypt-Archon/${{ env.PACKAGE_VERSION }}
            https://nuget.org/packages/LettuceEncrypt-Archon.Azure/${{ env.PACKAGE_VERSION }}
          draft: true
          prerelease: ${{ env.IS_STABLE_BUILD == 'false' }} # Example: v3.1.0-beta
          files: packages/*
